site_name: GOS Wiki
theme:
    name: material
    palette:
        - scheme: slate
          primary: deep blue
          accent: deep orange
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
        - scheme: default
          primary: deep blue
          accent: deep orange
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

validation:
    links:
        absolute_links: warn
        unrecognized_links: ignore
        not_in_nav: ignore
